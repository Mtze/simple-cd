name: simple-cd publish
description: Publish a deployable artifact (deploy.json) for simple-cd
branding: {icon: upload-cloud, color: blue}

inputs:
  images:
    description: |
      One image per line as name=ref. The ref must be pinned by digest, e.g.
      app=ghcr.io/org/app@sha256:... (use the digest output of docker/build-push-action).
    required: false
    default: ""
  helm-version:
    description: Version of the Helm chart pushed by this build (the chart itself is named in .cd.yaml).
    required: false
    default: ""
  auto-deploy:
    description: Target ids to deploy automatically, separated by spaces or commas. Each target must allow it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Write deploy.json
      shell: bash
      env:
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_HELM_VERSION: ${{ inputs.helm-version }}
        INPUT_AUTO_DEPLOY: ${{ inputs.auto-deploy }}
        OUT_DIR: ${{ runner.temp }}/simple-cd
      run: bash "$GITHUB_ACTION_PATH/publish.sh"
    - name: Upload cd-deploy artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cd-deploy
        path: ${{ runner.temp }}/simple-cd/deploy.json
        retention-days: 14
        if-no-files-found: error
