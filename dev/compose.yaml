# Local development stack: Postgres and Keycloak with a test realm.
# Ports are bound to 127.0.0.1 only.
name: simple-cd-dev
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: simplecd
      POSTGRES_PASSWORD: simplecd
      POSTGRES_DB: simplecd
    ports: ["127.0.0.1:5434:5432"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://127.0.0.1:8081
      KC_HTTP_PORT: "8081"
    ports: ["127.0.0.1:8081:8081"]
    volumes: ["./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro"]
