<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1475px;height:498px;background:#FFFFFF;" width="1475px" height="498px" viewBox="0 0 1475 498" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="653.299" y="35.421" fill="#000" font-size="22" textLength="167.277" font-weight="700" font-family="'Helvetica'">Target status</text></g><g class="entity" data-qualified-name="C" id="ent0001"><polygon points="639.4,138.609,651.4,150.609,639.4,162.609,627.4,150.609,639.4,138.609" fill="#FFF" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="entity" data-qualified-name="M" id="ent0002" data-source-line="5"><rect x="407.93" y="404.139" width="272.941" height="80.531" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:1;" rx="3" ry="3"/><line x1="407.93" y1="429.272" x2="680.871" y2="429.272" style="stroke:#2563EB;stroke-width:1;"/><text x="501.817" y="421.206" fill="#000" font-size="13" textLength="85.167" font-family="'Helvetica'">maintenance</text><text x="417.93" y="446.339" fill="#000" font-size="13" textLength="252.941" font-family="'Helvetica'">set by a maintainer or platform admin,</text><text x="447.961" y="461.472" fill="#000" font-size="13" textLength="192.88" font-family="'Helvetica'">with reason. Nobody deploys,</text><text x="493.318" y="476.605" fill="#000" font-size="13" textLength="102.166" font-family="'Helvetica'">no auto-deploy.</text></g><g class="entity" data-qualified-name="D" id="ent0003" data-source-line="6"><rect x="133.12" y="249.609" width="238.563" height="80.531" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:1;" rx="3" ry="3"/><line x1="133.12" y1="274.742" x2="371.683" y2="274.742" style="stroke:#2563EB;stroke-width:1;"/><text x="220.469" y="266.676" fill="#000" font-size="13" textLength="63.864" font-family="'Helvetica'">deploying</text><text x="143.12" y="291.809" fill="#000" font-size="13" textLength="218.563" font-family="'Helvetica'">a pending or running deployment</text><text x="164.997" y="306.942" fill="#000" font-size="13" textLength="174.808" font-family="'Helvetica'">(never for preview targets,</text><text x="166.026" y="322.075" fill="#000" font-size="13" textLength="172.751" font-family="'Helvetica'">they have one slot per PR)</text></g><g class="entity" data-qualified-name="L" id="ent0004" data-source-line="7"><rect x="407.1" y="257.169" width="274.604" height="65.398" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:1;" rx="3" ry="3"/><line x1="407.1" y1="282.302" x2="681.704" y2="282.302" style="stroke:#2563EB;stroke-width:1;"/><text x="523.157" y="274.236" fill="#000" font-size="13" textLength="42.491" font-family="'Helvetica'">locked</text><text x="417.1" y="299.369" fill="#000" font-size="13" textLength="254.604" font-family="'Helvetica'">lockable target, lock until in the future.</text><text x="421.483" y="314.502" fill="#000" font-size="13" textLength="245.838" font-family="'Helvetica'">Holder deploys, maintainers override.</text></g><g class="entity" data-qualified-name="A" id="ent0005" data-source-line="8"><rect x="716.4" y="264.739" width="250.001" height="50.266" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:1;" rx="3" ry="3"/><line x1="716.4" y1="289.872" x2="966.401" y2="289.872" style="stroke:#2563EB;stroke-width:1;"/><text x="812.062" y="281.806" fill="#000" font-size="13" textLength="58.678" font-family="'Helvetica'">available</text><text x="726.4" y="306.939" fill="#000" font-size="13" textLength="230.001" font-family="'Helvetica'">developers and maintainers deploy</text></g><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="10"><ellipse cx="639.4" cy="67.609" rx="10" ry="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="25"><path d="M1001,265.169 L1001,314.568 A3,3 0 0 0 1004,317.568 L1330.803,317.568 A3,3 0 0 0 1333.803,314.568 L1333.803,272.169 L1323.803,262.169 L1004,262.169 A3,3 0 0 0 1001,265.169" style="stroke:#CA8A04;stroke-width:1;" fill="#FEF9C3"/><path d="M1323.803,262.169 L1323.803,270.669 A1.5,1.5 0 0 0 1325.303,272.169 L1333.803,272.169 L1323.803,262.169" style="stroke:#CA8A04;stroke-width:1;" fill="#FEF9C3"/><text x="1028.677" y="279.236" fill="#000" font-size="13" textLength="268.449" font-family="'Helvetica'">The server computes the status on every</text><text x="1034.409" y="294.369" fill="#000" font-size="13" textLength="256.985" font-family="'Helvetica'">request. The first matching guard wins:</text><text x="1007" y="309.502" fill="#000" font-size="13" textLength="311.803" font-family="'Helvetica'">maintenance > deploying > locked > available.</text></g><!--link *start* to C--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="10" data-link-type="dependency"><path d="M639.4,77.899 C639.4,92.779 639.4,116.909 639.4,133.089" style="stroke:#475569;stroke-width:1;" fill="none" id="*start*-to-C"/><polygon points="639.4,138.089,643.4,129.089,639.4,133.089,635.4,129.089,639.4,138.089" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link C to M--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="11" data-link-type="dependency"><path d="M628.38,151.899 C554.33,153.909 130.86,166.519 80.4,192.609 C51.24,207.689 44.5,218.699 33.4,249.609 C21.3,283.289 11,302.229 33.4,330.139 C79.54,387.629 267.488,417.211 402.598,431.561" style="stroke:#475569;stroke-width:1;" fill="none" id="C-to-M"/><polygon points="407.57,432.089,399.043,427.161,402.598,431.561,398.198,435.116,407.57,432.089" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="34.4" y="294.08" fill="#334155" font-size="11" textLength="80.647" font-family="'Helvetica'">[maintenance]</text></g><!--link M to C--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk15" data-source-line="19" data-link-type="dependency"><path d="M680.97,433.899 C899.6,417.279 1308.12,379.919 1351.4,330.139 C1374.89,303.129 1374.42,277.009 1351.4,249.609 C1303.95,193.109 741.501,157.656 655.331,152.536" style="stroke:#475569;stroke-width:1;" fill="none" id="M-to-C"/><polygon points="650.34,152.239,659.087,156.766,655.331,152.536,659.561,148.78,650.34,152.239" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1369.84" y="294.08" fill="#334155" font-size="11" textLength="90.036" font-family="'Helvetica'">maintenance off</text></g><!--link C to D--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-source-line="12" data-link-type="dependency"><path d="M627.97,151.559 C553.1,151.399 134.78,152.299 97.4,192.609 C74.25,217.579 93.315,236.488 128.515,252.418" style="stroke:#475569;stroke-width:1;" fill="none" id="C-to-D"/><polygon points="133.07,254.479,126.52,247.124,128.515,252.418,123.221,254.413,133.07,254.479" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="98.4" y="210.32" fill="#334155" font-size="11" textLength="147.555" font-family="'Helvetica'">[else if active deployment]</text></g><!--link D to C--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk14" data-source-line="18" data-link-type="dependency"><path d="M266.76,249.479 C276.26,229.149 290.81,205.879 311.4,192.609 C365.42,157.779 571.031,152.584 622.841,151.814" style="stroke:#475569;stroke-width:1;" fill="none" id="D-to-C"/><polygon points="627.84,151.739,618.782,147.874,622.841,151.814,618.9,155.873,627.84,151.739" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="312.4" y="210.32" fill="#334155" font-size="11" textLength="112.702" font-family="'Helvetica'">deployment finished</text></g><!--link C to L--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk10" data-source-line="13" data-link-type="dependency"><path d="M628.37,152.119 C590.17,154.149 464.52,163.009 440.4,192.609 C421.36,215.969 440.084,236.427 469.244,254.107" style="stroke:#475569;stroke-width:1;" fill="none" id="C-to-L"/><polygon points="473.52,256.699,467.898,248.613,469.244,254.107,463.75,255.454,473.52,256.699" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="441.4" y="210.32" fill="#334155" font-size="11" textLength="154.22" font-family="'Helvetica'">[else if lockable and locked]</text></g><!--link L to C--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk13" data-source-line="17" data-link-type="dependency"><path d="M572,256.929 C581.42,245.459 591.75,232.239 600.4,219.609 C614.86,198.499 626.821,176.165 633.381,163.425" style="stroke:#475569;stroke-width:1;" fill="none" id="L-to-C"/><polygon points="635.67,158.979,627.994,165.15,633.381,163.425,635.106,168.812,635.67,158.979" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="617.43" y="203.82" fill="#334155" font-size="11" textLength="160.145" font-family="'Helvetica'">deploy by holder or override,</text><text x="631.067" y="216.625" fill="#334155" font-size="11" textLength="132.87" font-family="'Helvetica'">lock released or expired</text></g><!--link C to A--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk11" data-source-line="14" data-link-type="dependency"><path d="M650.63,151.919 C677.07,153.199 744.18,159.719 786.4,192.609 C809.94,210.939 823.367,237.694 831.687,259.634" style="stroke:#475569;stroke-width:1;" fill="none" id="C-to-A"/><polygon points="833.46,264.309,834.009,254.476,831.687,259.634,826.529,257.312,833.46,264.309" f